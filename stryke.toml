[package]
name = "blog"
version = "0.1.0"
description = "MenkeTechnologies blog. Static site generated by a stryke program, styled with the stryke docs HUD, hosted on GitHub Pages."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/blog"
edition = "2026"

# Site config read by lib/Blog/Site.stk. base_url has no trailing slash.
[blog]
title       = "MenkeTechnologies"
tagline     = "blog"
description = "Engineering notes from MenkeTechnologies: zshrs, stryke, zpwr and the rest of the stack."
base_url    = "https://menketechnologies.github.io/blog"
repo        = "https://github.com/MenkeTechnologies/blog"
author      = "MenkeTechnologies"
feed_limit  = 20

[scripts]
build = "s build.stk"
test  = "s test t/"
